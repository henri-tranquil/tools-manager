name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      # La clé PageSpeed Insights vient d'un secret du dépôt (facultatif : vide si absent).
      - run: npx ng build --base-href /tools-manager/ --define "PSI_API_KEY='${PSI_API_KEY}'"
        env:
          PSI_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
      - run: cp dist/tools-manager/browser/index.html dist/tools-manager/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/tools-manager/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
