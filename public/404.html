<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Page introuvable — L'Établi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffd23f" />
    <link rel="icon" type="image/svg+xml" href="/tools-manager/favicon.svg" />
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #fff4e0 radial-gradient(rgb(17 17 17 / 0.2) 1.2px, transparent 1.2px) 0 0 / 22px 22px;
        color: #111;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 560px;
        padding: 36px;
        border: 4px solid #111;
        border-radius: 18px;
        background: #fff;
        box-shadow: 10px 10px 0 #111;
      }
      .code {
        margin: 0;
        font: 900 96px/0.9 'Arial Black', system-ui, sans-serif;
        letter-spacing: -4px;
        color: transparent;
        -webkit-text-stroke: 3px #111;
      }
      h1 {
        margin: 12px 0;
        font: 900 32px/1.1 'Arial Black', system-ui, sans-serif;
      }
      p {
        font-size: 18px;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 14px 22px;
        border: 4px solid #111;
        border-radius: 12px;
        background: #ffd23f;
        box-shadow: 5px 5px 0 #111;
        color: #111;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 4px solid #111;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Cette page n'existe pas.</h1>
      <p>L'outil a peut-être changé d'adresse. Tous les outils sont rangés sur la page d'accueil.</p>
      <a href="/tools-manager/">Retour à L'Établi</a>
    </main>
  </body>
</html>
